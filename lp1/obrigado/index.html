<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscrição confirmada | Workshop de Marketplace</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0C0A08">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,200;0,300;0,600;0,800;1,300;1,700;1,900&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/lp1/css/style.css?v=20261029b">
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0113 0c0 5-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="1.75"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <main>
    <section class="sec sec--grid sec--form thanks">
      <div class="arc arc--low" aria-hidden="true"></div>
      <div class="wrap thanks__in">
        <img class="logo" src="/lp1/img/logo-branco.svg" alt="Workshop de Marketplace" width="781" height="303">

        <h1 class="display">
          <span class="thin">Inscrição</span>
          <span class="bold">confirmada!</span>
        </h1>

        <p class="lead">Sua vaga no Workshop de Marketplace está garantida.</p>

        <dl class="info">
          <div><dt><svg class="ic"><use href="#i-cal"/></svg>Data</dt><dd>24/11 <small>terça-feira</small></dd></div>
          <div><dt><svg class="ic"><use href="#i-pin"/></svg>Local</dt><dd>Espaço TS <small>Jaú-SP</small></dd></div>
          <!-- TODO: confirmar horário e endereço completo -->
          <div><dt><svg class="ic"><use href="#i-clock"/></svg>Horário</dt><dd>08h</dd></div>
        </dl>

        <!-- TODO: próximos passos (link do grupo do WhatsApp, adicionar à agenda etc.) -->
        <p class="thanks__note">Fique de olho no seu WhatsApp e no seu e-mail: vamos enviar todos os detalhes por lá.</p>
      </div>
    </section>
  </main>
  <!-- Pixel/GTM: disparar o evento de conversão (Lead) nesta página. -->
  <style>
    .thanks { min-height: 100dvh; display: grid; align-items: center; border: 0; }
    .thanks__in { max-width: 620px; display: grid; gap: 24px; }
    .thanks .info { margin-top: 8px; }
    .thanks__note { color: var(--muted); }
  </style>
</body>
</html>
